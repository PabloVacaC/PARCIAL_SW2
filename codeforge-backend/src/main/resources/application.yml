spring:
  application:
    name: codeforge-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeforge_central}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: false

codeforge:
  ai:
    gemini:
      api-key: ${GOOGLE_API_KEY}
      model: ${GEMINI_MODEL:gemini-3.6-flash}